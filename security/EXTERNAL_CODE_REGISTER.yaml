    usage: CRM application and job daemon (same image), dev environment, CRM-001
    usage_confirmed: "deploy/compose.json services crm-app and crm-daemon (entrypoint docker-daemon.sh), pinned to this exact tag and digest; checked by tests/unit/test_compose_policy.py (CRM-001)."
