    version: "3.2.26 (3.2 LTS, alpine)"
    digest: "sha256:1c3568e520453cc8ba98c39501febcf450429c80e6cc27ecad779961d76e597c"   # pulled and verified by the PL on DOCKER1, 2026-11-10
