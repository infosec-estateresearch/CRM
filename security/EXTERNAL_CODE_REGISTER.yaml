    origin: https://hub.docker.com/_/mariadb   # image: docker.io/library/mariadb
    version: "11.4.13 (11.4 LTS)"
    digest: "sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620"   # multi-arch index, registry lookup 2026-11-09
