# External software register — Estate Research CRM
# History: at bootstrap (2026-11-09) this register declared "no-incorporated-code"; that is no longer true.
# Reconciled 2026-11-13 (FOUNDRY Stage 1 v0.4 existing-product reassessment, docs/initiation/
# 2026-11-13-existing-product-reassessment.md section 10) from the repository at 330978598ac6 and the deployed beta.
# The list key stays "candidates" because scripts/release.py and tests/unit/compose_policy.py parse it
# (name/version/digest lines); every entry below is INCORPORATED (in use), and none carries a recorded approval.
# Scripts, the crm-load importer and the tests use the Python standard library only (import scan of
# scripts/, load/ and tests/); custom/ is Estate Research's own EspoCRM metadata and PHP (no third-party code).
coverage:
  status: partial
  basis: "Top-level images verified against deploy/compose.json, deploy/beta/compose.json and deploy/beta/restoretest/compose.json (pinned by digest, checked by scripts/release.py and tests/unit/test_compose_policy.py); Python imports scanned. The contents of the upstream images (PHP, Apache, EspoCRM bundled PHP/JS libraries, OS base layers) are NOT inventoried: no SBOM."
  assessed: 2026-11-13
  previous: {status: no-incorporated-code, basis: "Bootstrap commit contains documentation only.", assessed: 2026-11-09}
  approval_evidence: "No component approval is recorded in this register. Use in dev and beta followed Architect-approved WOs (CRM-001, CRM-007/007R); whether that constitutes component approval is for the Architect to confirm."
