# Broken fixture: restricts a <Directory>, which a later <Location> or another
# path can override, instead of every URL path (breaks conf_deny_by_default, and
# conf_authmerging_and, which has no <Location "/"> to check).
<Directory "/var/www/html">
    Require ip 127.0.0.1 ::1 ${CRM_ALLOWED_SOURCES}
</Directory>
