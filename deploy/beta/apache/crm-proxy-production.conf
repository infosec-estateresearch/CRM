# CRM-007 crm-beta: crm-app behind the edge proxy (crm-beta-edge). Git-controlled.
# deploy/beta/compose.json mounts this file read-only into crm-app only, at
# /etc/apache2/conf-enabled/crm-proxy.conf. Its policy is
# scripts/check_access.py check_proxy_conf (run by `check_access.py beta`).
#
# Trust boundary: crm-app publishes only 127.0.0.1:${CRM_BETA_APP_PORT}, and the
# only client that connects to that port is the edge, which admits only the
# PO's HAProxy (TLS terminated there). Anything on the host's loopback is
# trusted (docs/BETA.md). With Docker's userland proxy Apache sees the bridge
# gateway, not loopback, as the peer, so the peer address cannot tell the edge
# apart and is not used.
#
# So every request is marked HTTPS, unconditionally, and X-Forwarded-Proto is
# removed before EspoCRM sees it (no client may choose the scheme). mod_remoteip
# is not loaded: the client address Apache logs is the TCP peer.
#
# SetEnv needs mod_env and RequestHeader needs mod_headers. Each is loaded here
# if the image has not already enabled it. A missing module file stops Apache
# from starting (fail closed); nothing is wrapped in a silent <IfModule mod_*>.
<IfModule !env_module>
    LoadModule env_module /usr/lib/apache2/modules/mod_env.so
</IfModule>
<IfModule !headers_module>
    LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>
SetEnv HTTPS on
RequestHeader unset X-Forwarded-Proto
