# CRM-009 crm-beta UAT mode (CRM_BETA_MODE=uat): plain HTTP on the LAN, no TLS
# anywhere. Git-controlled. Nothing copies it: deploy/beta/compose.json mounts
# the file for CRM_BETA_MODE (this one in UAT mode) read-only, directly from
# the release directory, into crm-app at
# /etc/apache2/conf-enabled/crm-proxy.conf. `scripts/check_access.py beta`
# checks the file the mode resolves to with check_proxy_conf(text, "uat").
#
# Unlike crm-proxy.conf, HTTPS is NOT set: EspoCRM must build http:// redirects
# and must not mark cookies secure, or login over plain HTTP fails.
# X-Forwarded-Proto is still removed before EspoCRM sees it, so no client may
# choose the scheme. mod_remoteip is not loaded.
#
# RequestHeader needs mod_headers, loaded here if the image has not already
# enabled it. A missing module file stops Apache from starting (fail closed).
<IfModule !headers_module>
    LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>
RequestHeader unset X-Forwarded-Proto
