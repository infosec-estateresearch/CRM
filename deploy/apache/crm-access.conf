# CRM-001 LAN access control for crm-app (CRM-D019). Git-controlled.
# deploy/compose.json mounts this file read-only into crm-app only, at
# /etc/apache2/conf-enabled/crm-access.conf, so apache2.conf includes it
# server-wide and the default virtual host inherits it.
#
# Every URL path is restricted. <Location> sections are merged after
# <Directory> sections and .htaccess files. With "AuthMerging And", the Require
# below is combined with the authorization that already applies there (the
# grant that apache2.conf gives /var/www/): a request must pass both, so any
# authz deny applied earlier still holds and this block can only narrow
# access. The image's mod_rewrite [F] denies (data/, application/, custom/,
# vendor/) are not authorization and are not affected either way.
#
# Allowed: loopback, for the container's own healthcheck, and the networks in
# the CRM_ALLOWED_SOURCES environment variable, which Compose passes to crm-app
# from the runtime env file. Everyone else gets 403.
#
# The client address is the TCP peer address. mod_remoteip is not loaded and no
# request header is trusted.
#
# Fail closed:
# - variable undefined: Apache warns that it is not defined, leaves the
#   reference unexpanded, and mod_authz_host rejects it as an invalid address,
#   so the configuration does not parse and Apache does not start;
# - variable empty: only loopback is allowed, so every remote client is denied.
# Compose refuses to start crm-app before either can happen, because the
# variable is required in deploy/compose.json. To confirm at the operator stage.
<Location "/">
    AuthMerging And
    Require ip 127.0.0.1 ::1 ${CRM_ALLOWED_SOURCES}
</Location>
